name: wach_flutter
description: "W.A.C.H. - Workout Awareness & Continuous Health"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Lokalisierung (DE/EN)
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: 3.0.0

  # Local Database
  sembast: ^3.7.3
  sembast_web: ^2.3.0

  # Navigation
  go_router: ^14.6.0

  # Utilities
  path_provider: ^2.1.5
  # Die Version muss zu der passen, die `flutter_localizations` aus dem
  # SDK mitbringt — sonst laesst sich das Projekt nicht aufloesen. Mit
  # Flutter 3.47 ist das 0.20.x (vorher 0.19.0). Genutzt wird ohnehin nur
  # DateFormat, dessen API sich dabei nicht geaendert hat.
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1

  # Google Drive Sync
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2
  riverpod_annotation: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: 3.0.0
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  riverpod_lint: 3.0.0

flutter:
  uses-material-design: true
  # Erzeugt AppLocalizations aus lib/l10n/*.arb (Konfiguration: l10n.yaml)
  generate: true
