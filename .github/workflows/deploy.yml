name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: wach_flutter
        run: flutter pub get

      # Erzeugt lib/l10n/app_localizations*.dart aus den ARB-Dateien.
      # Der Build macht das zwar selbst, `flutter pub get` aber NICHT —
      # ohne diesen Schritt bricht jeder Befehl, der vor dem Build auf
      # den generierten Code zugreift (z. B. ein spaeteres `analyze`).
      - name: Generate localizations
        working-directory: wach_flutter
        run: flutter gen-l10n

      - name: Build web
        working-directory: wach_flutter
        run: flutter build web --release --base-href "/wach/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wach_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
