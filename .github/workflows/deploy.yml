name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Auch auf Pull Requests pruefen und bauen — veroeffentlicht wird von
  # dort nichts, das erledigt allein der Deploy-Schritt unten.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Erst pruefen, dann bauen: ein Stand, der die Tests nicht besteht,
  # soll gar nicht erst auf die Seite gelangen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: wach_flutter
        run: flutter pub get

      - name: Generate localizations
        working-directory: wach_flutter
        run: flutter gen-l10n

      # Riverpod erzeugt die Provider (*.g.dart). Ohne diesen Schritt
      # fehlen sie im frisch ausgecheckten Baum und nichts kompiliert.
      - name: Generate providers
        working-directory: wach_flutter
        run: dart run build_runner build

      # Hinweise (`info`) sollen den Durchlauf nicht abbrechen, Warnungen
      # und Fehler schon.
      - name: Analyze
        working-directory: wach_flutter
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: wach_flutter
        run: flutter test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Die ganze Historie, nicht nur den letzten Commit: die
          # Versionsnummer entsteht aus deren Anzahl. Mit der Voreinstellung
          # (ein Commit) stand dort immer 1.0.1.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: wach_flutter
        run: flutter pub get

      # Erzeugt lib/l10n/app_localizations*.dart aus den ARB-Dateien.
      # Der Build macht das zwar selbst, `flutter pub get` aber NICHT —
      # ohne diesen Schritt bricht jeder Befehl, der vor dem Build auf
      # den generierten Code zugreift (z. B. ein spaeteres `analyze`).
      - name: Generate localizations
        working-directory: wach_flutter
        run: flutter gen-l10n

      # Riverpod erzeugt die Provider (*.g.dart). Ohne diesen Schritt
      # fehlen sie im frisch ausgecheckten Baum und nichts kompiliert.
      - name: Generate providers
        working-directory: wach_flutter
        run: dart run build_runner build

      # Die Versionsnummer entsteht aus der Anzahl der Commits, damit sie
      # ohne Zutun hochtickt (siehe tools/build.mjs fuer den lokalen Weg).
      - name: Build web
        working-directory: wach_flutter
        run: |
          APP_VERSION="1.0.$(git rev-list --count HEAD)"
          echo "Version $APP_VERSION"
          flutter build web --release --base-href "/wach/"             --dart-define=APP_VERSION="$APP_VERSION"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wach_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
